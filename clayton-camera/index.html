<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================================================================
       REDIRECT STUB — the person entity hub moved to its own domain.

       This path hosted the full hub for a few hours on 2026-07-24 before
       claytoncamera.com was registered. It was never indexed, so the
       move cost no accumulated authority.

       GitHub Pages cannot serve a real 301, so this uses the same
       pattern as /work-with-clayton/: cross-domain canonical +
       noindex,follow + meta refresh + JS replace. The canonical is what
       consolidates ranking signals; noindex,follow keeps this URL out of
       the index while still passing link equity onward.

       DO NOT restore page content here. Two copies of the same person
       page competing for the same name query is exactly the duplicate
       that canonicalisation exists to prevent.
       ================================================================ -->

  <title>Clayton Camera — now at claytoncamera.com</title>
  <link rel="canonical" href="https://claytoncamera.com/">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://claytoncamera.com/">
  <script>
    // Preserve any query string on the way over.
    location.replace('https://claytoncamera.com/' + (location.search || ''));
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background:#08080d; color:#f4f4f8;
      display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; text-align:center; padding:24px; }
    a { color:#22d3ee; font-weight:600; }
  </style>
</head>
<body>
  <p>
    Clayton Camera has moved to <a href="https://claytoncamera.com/">claytoncamera.com</a>.<br>
    If you are not redirected automatically, follow the link.
  </p>
</body>
</html>
